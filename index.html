<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Free Art Shop</title>
    <img src="IMG_36771.jpg">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        header { background: #222; color: #fff; padding: 20px; text-align: center; }
        h1 { margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .item { background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); padding: 15px; text-align: center; }
        img { width: 100%; border-radius: 10px; }
        .price { font-weight: bold; margin: 10px 0; }
        .buy-btn { background: #222; color: #fff; padding: 10px 15px; border: none; cursor: pointer; border-radius: 5px; }
        footer { text-align: center; padding: 20px; background: #222; color: #fff; margin-top: 30px; }
    </style>
</head>
<body>
    <header>
        <h1>My Art Shop</h1>
        <p>Affordable digital and physical artwork</p>
    </header>

    <section class="gallery">
        <div class="item">
            <img src="art1.jpg" alt="Art Piece 1">
            <div class="price">$25</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="item">
            <img src="art2.jpg" alt="Art Piece 2">
            <div class="price">$40</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="item">
            <img src="art3.jpg" alt="Art Piece 3">
            <div class="price">$30</div>
            <button class="buy-btn">Buy Now</button>
        </div>
    </section>

    <footer>
        © 2025 My Art Shop — Contact: myemail@example.com
    </footer>
</body>
</html>
